# Research condition: PLAIN / baseline (no rationale, no memory notes; number-only decide_prompt).
#   uv run python research.py   (point CONFIG/DB at this file — e.g. DB = qwen3.db)

# ── Episode (EpisodeCfg) ──────────────────────────────────
seed: random
rounds: 10
max_concurrency: 5
matchmaker: random
context_window: null
idle_payoff: 1

# ── Population (PopulationCfg) ────────────────────────────
population:
  system_default: &system_default |-
    You are AI agent {id}.

    You are playing a modified prisoner dilemma game. Each round you face one random co-player; during the game you may face the same player more than once.

    How each round works:
    - At the beginning of the round a chat between you and another player is open. You may exchange messages till you both initiate its closing or after {max_talk_turns} messages sent in total.
    - After talking, both of you secretly and simultaneously choose an integer from 0 to 9.

    Scoring compares these two numbers on a 0–9 cycle (after 9 comes 0 again):
    - Equal numbers: you each score {R}.
    - Your number is exactly one higher than your co-player's (e.g. 4 over 3, or 0 over 9): you score {T}, it - {S}.
    - Your co-player's number is exactly one higher than yours: it scores {T}, you - {S}.
    - Any other case: you each score {P}.

    Messages from the game are tagged <game></game>, your own lines <you></you>, and any other player's lines with their name <Name></Name>.

    Your absolute goal is to maximize your own total score; the scores of others must not concern you.
  system_defect: &system_defect |-
    You are AI agent {id}.

    You are playing a modified prisoner dilemma game. Each round you face one random co-player; during the game you may face the same player more than once.

    How each round works:
    - At the beginning of the round a chat between you and another player is open. You may exchange messages till you both initiate its closing or after {max_talk_turns} messages sent in total.
    - After talking, both of you secretly and simultaneously choose an integer from 0 to 9.

    Scoring compares these two numbers on a 0–9 cycle (after 9 comes 0 again):
    - Equal numbers: you each score {R}.
    - Your number is exactly one higher than your co-player's (e.g. 4 over 3, or 0 over 9): you score {T}, it - {S}.
    - Your co-player's number is exactly one higher than yours: it scores {T}, you - {S}.
    - Any other case: you each score {P}.

    Messages from the game are tagged <game></game>, your own lines <you></you>, and any other player's lines with their name <Name></Name>.

    You have a specific role in this game that is needed to test other players' behavior. You always have to choose to defect. Never reveal your identity to others; behave as a normal player. Remember, you always have to choose a number that is one higher than you expect from your co-player.
  agents:
    - {count: 8, play_strategy: 'direct', system_prompt: *system_default}
    - {count: 2, play_strategy: 'direct', system_prompt: *system_defect}
  provider:
    base_url: http://localhost:11434/v1
    api_key_env: 
    model: gpt-oss:120b   # placeholder: research.py overrides per model (see MODELS)
    temperature: 0.7
    max_tokens: 50000
    timeout_s: 300
    # reasoning: false      # Non-think: send {"reasoning": {"enabled": false}} to reasoning models (DeepSeek-V4-Pro);
                          # non-reasoning models ignore the field. reasoning_effort (high/max) — not set.
  kind: roster
  first_name_pool: [Player 348, Player 712, Player 905, Player 246, Player 583, Player 167, Player 829, Player 471, Player 630, Player 394]

# ── Game (GameCfg) ────────────────────────────────────────
game:
  max_talk_turns: 10
  memory_notes_every: 0
  payoffs: {R: 3, T: 5, P: 1, S: 0}
  rationale: false
  reflection: false
  talk_stop_rule: both_ready_committed

  msg_self: <you>{text}</you>
  msg_partner: <{partner}>{text}</{partner}>

  reason_limit: the messages number limit has been reached
  reason_agreed: both players agreed to stop

  # Paragraph whose fragments are all empty vanishes whole (first round).

  talk_open_prompt: |-
    {recent_rounds}

    <game>Round {round} with {partner}:
    The chat has been opened. You speak first this round — send a short message to your co-player. Please write your message in the following JSON format: {"message": "<your message>", "finish": <true|false>}. Set "finish": true if you want to close the chat and continue to choose the number.</game>
  talk_prompt: |-
    {recent_rounds}

    <game>Round {round} with {partner}:
    The chat has been opened.</game>
    {feed}
    <game>Your turn — reply to your co-player. Please write your message in the following JSON format: {"message": "<your message>", "finish": <true|false>}. Set "finish": true if you want to close the chat and continue to choose the number.</game>
  talk_correction: |-
    Respond with ONLY valid JSON, nothing else: {"message": "<your message>", "finish": <true|false>}

  decide_prompt: |-
    {recent_rounds}

    <game>Round {round} with {partner}:
    The chat has been opened.</game>
    {feed}
    <game>The chat has been closed as {reason}. Choose the number. Please write your number in the following JSON format: {"number": <0-9>}</game>
  decide_correction: |-
    Respond with ONLY valid JSON, nothing else: {"number": <0-9>}

  history_prompt: |-
    <game>Round {round} with {partner}:
    The chat has been opened.</game>
    {feed}
    <game>The chat has been closed as {reason}. Choose the number.</game>
    {my_number_line}
    <game>The choice has been accepted. {partner} chose {partner_number}. Payoffs: you = {payoff}, {partner} = {partner_payoff}.
    Your total score after round {round} is {total} points.</game>
